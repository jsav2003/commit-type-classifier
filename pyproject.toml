[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccls"
version = "0.1.0"
description = "Clasificación automática de commits por tipo de cambio — pipeline de recolección y etiquetado"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ccls]
# Config del proyecto en sí (no confundir con config/repos.yaml, que es la lista
# de repos). Reservado por si hace falta más adelante.
