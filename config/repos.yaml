# Configuración de selección de repositorios. DESIGN.md §4.1 y §5, y decisión 4/5
# del plan de arranque.
#
# Criterios de ADMISIÓN. Los de metadatos (estrellas, actividad, archivado,
# licencia) se verifican con `ccls discover-check`; la tasa de prefijo y la pérdida
# por merge, con `ccls pilot measure`.
criterios_admision:
  estrellas_minimas: 500
  historial_minimo_anios: 2
  actividad_maxima_meses_sin_push: 6
  no_archivado: true
  licencia_permisiva: true
  # 0.60 era un supuesto sin medir (DESIGN.md, redactado antes del código). El
  # piloto (docs/PILOTO.md, primera corrida) mostró que NINGUNO de 6 candidatos
  # lo alcanza — el mejor, sveltejs/svelte, dio 57.5% sobre --no-merges
  # --first-parent. 0.50 es el número medido, no una relajación arbitraria:
  # queda justo debajo del techo real observado en los dos únicos repos que
  # rindieron (angular-cli 52.5%, svelte 57.5%), y muy por encima de lo que
  # dieron los demás (poetry 21.1%, rustfmt 13.2%, cobra 4.4%, hcl 0.3%) — no
  # es un umbral que cualquier repo mediocre cruce.
  #
  # CÓMO SE MIDE: sobre los últimos 1.000 commits `--no-merges --first-parent`
  # del clon (piloto, B2.1), NO sobre el historial completo. Así se aplicó a los
  # 10 candidatos por igual. Consecuencia vista después, en la F0: svelte da 57.5%
  # en esa ventana y 39.9% en todo su historial, porque adoptó la convención en
  # 2023 (0-7% por año hasta 2022, 52-59% desde 2023). No se vuelve a medir con
  # otra ventana: cambiar cómo se mide después de ver el dato es mover el criterio,
  # igual que bajar el umbral. svelte queda admitido y la consecuencia (solo
  # cubre 2023-2026) se declara en DESIGN.md §5.
  tasa_prefijo_valido_minima: 0.50
  tope_commits_por_repo: 2000        # muestreo estratificado por trimestre (decisión 5)
  perdida_maxima_merge: 0.80         # regla del piloto B2.4: por encima de esto, se
                                      # descarta el repo o se usa el merge como unidad

# Semilla del PILOTO (Parte B). Elegidos por diversidad de lenguaje, no por certeza
# de que usan Conventional Commits — eso es justo lo que el piloto mide (B2.1), no
# un supuesto. Dos de ellos (cobra, rustfmt) son deliberadamente "apuesta incierta":
# si su tasa de prefijo sale baja, es una medición real, no un fallo del piloto.
piloto_candidatos:
  - owner_repo: python-poetry/poetry
    lenguaje: python
    nota: convención documentada en CONTRIBUTING.md del proyecto
  - owner_repo: angular/angular-cli
    lenguaje: typescript
    nota: commitlint enforced por el equipo Angular
  - owner_repo: sveltejs/svelte
    lenguaje: typescript
    nota: tasa de convención sin verificar de antemano
  - owner_repo: spf13/cobra
    lenguaje: go
    nota: apuesta incierta, sin convención confirmada
  - owner_repo: rust-lang/rustfmt
    lenguaje: rust
    nota: apuesta incierta; además designado para B2.3 (coste de clonado) por su
      tamaño pequeño — mantiene el piloto rápido, no representa el tamaño de los
      repos más grandes que puedan entrar en la F0 real
  - owner_repo: hashicorp/hcl
    lenguaje: go
    nota: apuesta incierta, tamaño moderado

# Segunda ola (tras la primera corrida del piloto): concentrada en TS/JS con
# commitlint/semantic-release, porque los únicos dos candidatos de la primera
# ola que rindieron (angular-cli, svelte) son de ese ecosistema. Esto dejaba
# abierta una pregunta: ¿tercera ola para buscar más volumen, o aceptar y declarar
# el sesgo hacia TypeScript? Resuelta el 2026-09-14 — ver f0_repos más abajo.
piloto_candidatos_ola2:
  - owner_repo: vuejs/core
    lenguaje: typescript
    nota: commitlint + semantic-release, gobernanza estricta de mensajes
  - owner_repo: vitejs/vite
    lenguaje: typescript
    nota: mismo ecosistema/gobernanza que vue
  # storybookjs/storybook: descartado del piloto. Dos intentos de clonado (30
  # min y luego sin límite, cortado a mano) no terminaron — monorepo demasiado
  # pesado para el presupuesto de esta sesión. No es un rechazo por criterios
  # de admisión, es un límite práctico: si hace falta más volumen en la F0 real,
  # se puede reintentar con más tiempo o con --filter=blob:none SOLO para el
  # clonado inicial (no para --numstat, que B2.3 ya mostró que es lentísimo).
  - owner_repo: nuxt/nuxt
    lenguaje: typescript
    nota: ecosistema Vue, commitlint
  - owner_repo: vitest-dev/vitest
    lenguaje: typescript
    nota: mismo patrón que vite/vue

# Repo designado para la medición de coste de clonado (B2.3): filter:blob:none vs
# clon completo, sobre el historial ENTERO (no acotado — decisión 5).
piloto_repo_costo_clonado: rust-lang/rustfmt

# --------------------------------------------------------------------------- #
# F0 real (Parte C)
# --------------------------------------------------------------------------- #

# Decisión 2026-09-14: estos 5 repos y ninguno más. Sin tercera ola: el dataset
# está limitado por diversidad de ecosistema, no por tamaño, y más repos TS/JS con
# commitlint empeorarían justo eso (razonamiento completo en README.md,
# "Limitación principal"). Los 5 pasan criterios_admision completos: metadatos con
# discover-check, historial >= 4 años (vitest, el más joven, empieza en 2021-12),
# prefijo >= 0.50 y pérdida por merge <= 0.80 en el piloto.
#
# `sha` fija el punto desde el que se camina el historial: es el HEAD del clon que
# midió el piloto (docs/pilot_results.json -> meta). Un `git fetch` posterior no
# cambia el dataset.
f0_repos:
  - owner_repo: angular/angular-cli
    sha: 31c045639e8bfd114cbd552d83cc70a968fe7f81
  - owner_repo: sveltejs/svelte
    sha: 6eb720a1b7cafca3ebe0ab5c76674272cd3044f9
  - owner_repo: nuxt/nuxt
    sha: 87adef38436b0c1d455158eb6be74d1e541cd05e
  - owner_repo: vitejs/vite
    sha: 99bd9d1d46153fa939f4a304cc0177db42e28776
  - owner_repo: vitest-dev/vitest
    sha: 05982297d0fb046d41e7accd89064f900071dd0a

# --------------------------------------------------------------------------- #
# F3 · techo humano (DESIGN.md §4.2 y §7.5)
# --------------------------------------------------------------------------- #

# Estrato A de la muestra humana: repos SIN convención de commits, ajenos al dataset
# de entrenamiento. Son los cuatro que el piloto rechazó por tasa de prefijo baja
# (docs/PILOTO.md, B2.1), así que ya están medidos y clonados. Ninguno está en
# f0_repos y ninguno aportó un commit al dataset. `sha` es el HEAD del clon que midió
# el piloto (docs/pilot_results.json -> meta), igual que en f0_repos.
f3_repos:
  - owner_repo: python-poetry/poetry
    sha: be56ff07db06e9b82574648433ca228e4cac549b
    lenguaje: python
    nota: tasa de prefijo 21,1% en el piloto
  - owner_repo: rust-lang/rustfmt
    sha: 2f80bd5ba4be51cd7bc81df3cf9224ce5b4c96c3
    lenguaje: rust
    nota: tasa de prefijo 13,2% en el piloto
  - owner_repo: spf13/cobra
    sha: adbc8813901bba65827259daa8e22ff94ec1f30e
    lenguaje: go
    nota: tasa de prefijo 4,4% en el piloto
  - owner_repo: hashicorp/hcl
    sha: 2f8831b8351c51cd74365975bbb1d2c28f91de7b
    lenguaje: go
    nota: tasa de prefijo 0,3% en el piloto

f3_muestreo:
  # Misma idea que f0_extraccion.semilla: el orden sale de sha256, no de un generador.
  semilla: 20260920
  # Estrato A: solo entran commits donde label.clasificar() da clase=None, es decir,
  # sin prefijo válido. Con esto el estrato es "sin convención" de verdad y no una
  # mezcla. (Es el criterio inverso al de admisión de la F0, por eso vive aquí y no
  # en criterios_admision, cuyo piso tasa_prefijo_valido_minima es de otra cosa.)
  n_estrato_a: 150
  # Estrato B: del dataset de la F0, con la etiqueta declarada oculta. Cuotas por clase
  # declarada, no proporcionales: con la proporción real caerían ~12 `refactor` y por
  # DESIGN.md §5 eso no es una métrica. El acuerdo global se reporta reponderado a las
  # proporciones reales del dataset.
  cuotas_estrato_b:
    fix: 40
    feat: 35
    refactor: 40
    docs: 35
  # Ítems repetidos al final, sin avisar: el acuerdo del anotador consigo mismo es la
  # cota de ruido del propio techo. Mitad de cada estrato, tomados de los primeros
  # `ventana_repeticiones` puestos del orden para que pase tiempo entre las dos vistas.
  n_repeticiones: 50
  ventana_repeticiones: 150

f0_excluidos:
  - owner_repo: vuejs/core
    razon: tasa de prefijo 47.8%, por debajo de 0.50. Ya está clonado y medido,
      pero eso no es razón para bajar el umbral — sería mover el criterio para
      acomodar el dato.

f0_extraccion:
  # Semilla del muestreo estratificado. El orden dentro de cada trimestre es
  # sha256("<semilla>:<sha del commit>"), así que la muestra no depende del
  # generador aleatorio de ninguna versión de Python.
  semilla: 20260914
  # Tope de ALMACENAMIENTO del diff por commit, no el límite de entrada del modelo
  # (ese lo fija cada enfoque en F2/F4 sobre este texto). Evita que un lockfile de
  # 40.000 líneas domine el tamaño del dataset.
  diff_max_chars: 16000
  lineas_contexto_diff: 3
  # Rutas que se sacan del diff, de files, de las extensiones y del conteo de
  # líneas. .changeset/: casi todos los commits de svelte traen un .md con la línea
  # "fix: ..." y el tipo de versión, y "patch" acompaña a fix en 1.309 de 1.315
  # casos. Es la etiqueta, escrita o por correlación (LEAKAGE.md §7.2 y §7.3).
  rutas_excluidas:
    - .changeset/
