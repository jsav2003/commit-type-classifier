name: CI

# NOTA: esta cuenta de GitHub está bloqueada por facturación (ver README.md),
# así que este workflow todavía NO ha corrido. Queda listo para cuando se
# desbloquee; mientras tanto la reproducibilidad (DESIGN.md §7.7) se verifica
# en local con los mismos comandos que aquí.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest -q
